name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const manifest = require('./manifest.json'); const tag = process.env.TAG.replace(/^v/, ''); if (manifest.version !== tag) { console.error('Tag ' + tag + ' does not match manifest version ' + manifest.version); process.exit(1); }"

      - name: Run checks
        run: npm run check

      - name: Build release assets
        run: npm run build

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
            LICENSE

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            main.js
            styles.css
            manifest.json
            LICENSE
