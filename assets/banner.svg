<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="syncy-title syncy-desc">
  <title id="syncy-title">Syncy for Obsidian</title>
  <desc id="syncy-desc">Self-hosted sync for Obsidian vaults, notes, attachments, plugins, settings and version history.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.58" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#background)"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <circle cx="1010" cy="112" r="160" fill="url(#glow)"/>
  <circle cx="1110" cy="250" r="120" fill="url(#glow)" opacity="0.55"/>

  <g transform="translate(72 72)">
    <rect width="68" height="68" rx="18" fill="#14B8A6"/>
    <rect x="1" y="1" width="66" height="66" rx="17" fill="none" stroke="#99F6E4" stroke-opacity="0.55"/>
    <path d="M22 37a14 14 0 0 1 23-10" fill="none" stroke="#042F2E" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M46 31a14 14 0 0 1-23 10" fill="none" stroke="#042F2E" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M43 20l4 7-8 1" fill="none" stroke="#042F2E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 48l-4-7 8-1" fill="none" stroke="#042F2E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="164" y="132" fill="#F8FAFC" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="7">SYNCY</text>
  <text x="166" y="174" fill="#CBD5E1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="500">Your vault. Your server. Everything in sync.</text>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="166" y="208" width="116" height="32" rx="16" fill="#0F766E" fill-opacity="0.55" stroke="#5EEAD4" stroke-opacity="0.35"/>
    <text x="224" y="229" fill="#CCFBF1" text-anchor="middle">Obsidian</text>

    <rect x="294" y="208" width="138" height="32" rx="16" fill="#1E293B" fill-opacity="0.9" stroke="#94A3B8" stroke-opacity="0.28"/>
    <text x="363" y="229" fill="#E2E8F0" text-anchor="middle">Self-hosted</text>

    <rect x="444" y="208" width="148" height="32" rx="16" fill="#1E293B" fill-opacity="0.9" stroke="#94A3B8" stroke-opacity="0.28"/>
    <text x="518" y="229" fill="#E2E8F0" text-anchor="middle">E2EE optional</text>

    <rect x="604" y="208" width="132" height="32" rx="16" fill="#1E293B" fill-opacity="0.9" stroke="#94A3B8" stroke-opacity="0.28"/>
    <text x="670" y="229" fill="#E2E8F0" text-anchor="middle">Versioned</text>
  </g>

  <g transform="translate(852 58)">
    <rect x="0" y="0" width="270" height="204" rx="22" fill="#0B1220" fill-opacity="0.72" stroke="#94A3B8" stroke-opacity="0.22"/>

    <g transform="translate(26 26)">
      <rect width="84" height="50" rx="11" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.45"/>
      <circle cx="15" cy="16" r="3.5" fill="#2DD4BF"/>
      <circle cx="27" cy="16" r="3.5" fill="#38BDF8"/>
      <rect x="12" y="29" width="58" height="5" rx="2.5" fill="#64748B" fill-opacity="0.7"/>
      <rect x="12" y="39" width="37" height="4" rx="2" fill="#475569"/>

      <rect x="140" width="84" height="50" rx="11" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.45"/>
      <circle cx="155" cy="16" r="3.5" fill="#2DD4BF"/>
      <circle cx="167" cy="16" r="3.5" fill="#38BDF8"/>
      <rect x="152" y="29" width="58" height="5" rx="2.5" fill="#64748B" fill-opacity="0.7"/>
      <rect x="152" y="39" width="37" height="4" rx="2" fill="#475569"/>

      <path d="M92 25h40" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
      <path d="M128 19l8 6-8 6" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="52" y="82" width="124" height="42" rx="11" fill="#0F766E" fill-opacity="0.35" stroke="#5EEAD4" stroke-opacity="0.55"/>
      <circle cx="68" cy="103" r="5" fill="#5EEAD4"/>
      <rect x="82" y="96" width="76" height="6" rx="3" fill="#CCFBF1" fill-opacity="0.82"/>
      <rect x="82" y="108" width="48" height="4" rx="2" fill="#99F6E4" fill-opacity="0.45"/>

      <path d="M28 77v20a8 8 0 0 0 8 8h8" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
      <path d="M200 77v20a8 8 0 0 1-8 8h-8" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
      <path d="M52 128v18l10 6" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
      <path d="M176 128v18l-10 6" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>

      <circle cx="72" cy="160" r="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.55"/>
      <path d="M66 160l4 4 8-9" fill="none" stroke="#7DD3FC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="156" cy="160" r="13" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <path d="M150 166l4-4 4 3 5-7" fill="none" stroke="#5EEAD4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="25.25" fill="none" stroke="#5EEAD4" stroke-opacity="0.22"/>
</svg>
